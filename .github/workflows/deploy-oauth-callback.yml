name: Deploy OAuth callback

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/deploy-oauth-callback.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage callback site
        run: |
          mkdir _site
          cp -R site/. _site/
          cp public/icon-128.png _site/icon-128.png
      - name: Upload callback site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
