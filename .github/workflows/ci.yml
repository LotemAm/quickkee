name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck & Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - run: yarn --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test

  build:
    name: Build Chrome Extension
    needs: verify
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - run: yarn --frozen-lockfile
      - run: yarn build:chrome
      - uses: actions/upload-artifact@v4
        with:
          name: quickkee-chrome
          path: dist_chrome