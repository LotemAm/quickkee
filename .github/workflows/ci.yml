name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck & Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test

  build:
    name: Build Chrome Extension
    needs: verify
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn build:chrome
      - uses: actions/upload-artifact@v4
        with:
          name: quickkee-chrome
          path: dist_chrome

  e2e:
    name: E2E Tests
    needs: verify
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum yarn test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7