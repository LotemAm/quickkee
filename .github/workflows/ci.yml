name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, Lint & Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test

  build:
    name: Build Chrome Extension
    needs: verify
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn build:production
        env:
          VITE_GDRIVE_WEB_CLIENT_ID: ${{ secrets.VITE_GDRIVE_WEB_CLIENT_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: quickkee-chrome
          path: quickkee.zip

  e2e:
    name: E2E Tests
    needs: verify
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum yarn test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
